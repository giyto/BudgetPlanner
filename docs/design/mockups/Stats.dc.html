<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Статистика</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Onest', system-ui, sans-serif; overflow: hidden">

<header style="padding: 20px 16px 10px 20px; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 600">Статистика</h1>
<div role="group" aria-label="Интервал" style="display: flex; background: {{t.segTrack}}; border-radius: 22px; padding: 4px; gap: 4px">
<button type="button" onClick="{{setPeriod}}" aria-pressed="{{periodPressed}}" style="flex: 1; height: 38px; border: 0; border-radius: 19px; background: {{periodBg}}; color: {{t.ink}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Период</button>
<button type="button" onClick="{{setMonth}}" aria-pressed="{{monthPressed}}" style="flex: 1; height: 38px; border: 0; border-radius: 19px; background: {{monthBg}}; color: {{t.ink}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Месяц</button>
</div>
</header>

<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 16px">

<section aria-label="Расходы по категориям" style="background: {{t.card}}; border-radius: 22px; padding: 16px 16px 16px 12px; display: flex; align-items: center; gap: 12px">
<div style="position: relative; width: 156px; height: 156px; flex-shrink: 0">
<svg width="156" height="156" viewBox="0 0 200 200" role="img" aria-label="{{donutLabel}}">
<g transform="rotate(-90 100 100)" fill="none" stroke-width="24">
<circle cx="100" cy="100" r="70" stroke="{{c0}}" stroke-dasharray="{{s0.dash}}" stroke-dashoffset="{{s0.offset}}"></circle>
<circle cx="100" cy="100" r="70" stroke="{{c1}}" stroke-dasharray="{{s1.dash}}" stroke-dashoffset="{{s1.offset}}"></circle>
<circle cx="100" cy="100" r="70" stroke="{{c2}}" stroke-dasharray="{{s2.dash}}" stroke-dashoffset="{{s2.offset}}"></circle>
<circle cx="100" cy="100" r="70" stroke="{{c3}}" stroke-dasharray="{{s3.dash}}" stroke-dashoffset="{{s3.offset}}"></circle>
<circle cx="100" cy="100" r="70" stroke="{{c4}}" stroke-dasharray="{{s4.dash}}" stroke-dashoffset="{{s4.offset}}"></circle>
</g>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-size: 12px; color: {{t.muted}}">{{rangeShort}}</span>
<span style="font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 600; color: {{t.ink}}">{{total}}</span>
</div>
</div>
<ul style="list-style: none; margin: 0; padding: 0; flex: 1; display: flex; flex-direction: column; gap: 9px; min-width: 0">
<sc-for list="{{legend}}" as="l" hint-placeholder-count="5">
<li style="display: flex; align-items: center; gap: 8px; font-size: 13px">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: {{l.color}}; flex-shrink: 0"></span>
<span style="flex: 1; min-width: 0; color: {{l.nameColor}}">{{l.name}}</span>
<span style="font-weight: 600; color: {{l.pctColor}}">{{l.pct}}</span>
</li>
</sc-for>
</ul>
</section>

<section aria-label="Расходы по дням" style="background: {{t.card}}; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">По дням</h2>
<span style="font-size: 13px; color: {{t.muted}}">последние 7 дней</span>
</div>
<div style="position: relative; height: 128px; display: flex; align-items: flex-end; gap: 10px; padding-top: 8px">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 62px; border-top: 1.5px dashed {{t.chart.limitLine}}"></div>
<span style="position: absolute; right: 0; bottom: 66px; font-size: 11px; font-weight: 600; color: {{t.sub}}; background: {{t.card}}; padding: 0 4px">лимит 781 ₽</span>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
<div role="img" aria-label="{{b.aria}}" style="flex: 1; height: {{b.h}}; background: {{b.color}}; border-radius: 8px 8px 4px 4px"></div>
</sc-for>
</div>
<div style="display: flex; gap: 10px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
<span style="flex: 1; text-align: center; font-size: 12px; color: {{b.labelColor}}; font-weight: {{b.labelWeight}}">{{b.label}}</span>
</sc-for>
</div>
<div style="display: flex; gap: 16px; font-size: 12px; color: {{t.sub}}">
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: {{t.chart.barOk}}"></span>в пределах лимита</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: {{t.chart.barOver}}"></span>больше лимита</span>
</div>
</section>

<section aria-label="Сравнение с прошлым периодом" style="background: {{t.card}}; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">По сравнению с прошлым периодом</h2>
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 13px; font-weight: 700; color: {{t.warn}}; background: {{t.warnSoft}}; border-radius: 8px; padding: 4px 8px">↑ 36%</span>
<span style="font-size: 14px; color: {{t.sub}}">Кафе: на 400 ₽ больше</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 13px; font-weight: 700; color: {{t.positive}}; background: {{t.positiveSoft}}; border-radius: 8px; padding: 4px 8px">↓ 12%</span>
<span style="font-size: 14px; color: {{t.sub}}">Транспорт: на 150 ₽ меньше</span>
</div>
</section>

</main>

<nav aria-label="Основная навигация" style="height: 76px; flex-shrink: 0; background: {{t.navBg}}; border-top: 1px solid {{t.line}}; display: flex; justify-content: space-around; align-items: center; padding: 0 8px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; text-decoration: none; color: {{t.muted}}; font-size: 12px; font-weight: 500">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path></svg></span>Главная</a>
<a href="Operations.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; text-decoration: none; color: {{t.muted}}; font-size: 12px; font-weight: 500">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg></span>Операции</a>
<a href="Stats.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; text-decoration: none; color: {{t.ink}}; font-size: 12px; font-weight: 600">
<span style="width: 56px; height: 30px; border-radius: 15px; background: {{t.primarySoft}}; color: {{t.primaryText}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg></span>Статистика</a>
<a href="Assistant.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; text-decoration: none; color: {{t.muted}}; font-size: 12px; font-weight: 500">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"></path></svg></span>Помощник</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { month: false };
  }
  renderVals() {
    const THEMES = {
      light: {
        bg: '#EFF1F5', card: '#FFFFFF', card2: '#E4E7ED', ink: '#191C1F', muted: '#575E68', sub: '#3A4048',
        line: '#E2E5EA', chipBorder: '#CDD2DA',
        primary: '#4B52E0', onPrimary: '#FFFFFF', primaryText: '#4B52E0', primarySoft: '#E4E5FC',
        hero: '#191C1F', heroBorder: '#191C1F', heroText: '#FFFFFF', heroMuted: '#B9BEC7', heroProgress: '#5EE0A8',
        positive: '#0B7650', positiveSoft: '#DDF5EA', warn: '#B23A0A', warnSoft: '#FDE7DA', warnOnHero: '#FFB088',
        hint: '#6D3FD1', hintSoft: '#EFE7FD', segTrack: '#E4E7ED', segOn: '#FFFFFF',
        reserve: '#9AA1AC', left: '#9FE3C5', shadow: 'rgba(25,28,31,0.25)', navBg: '#FFFFFF',
        cat: { cart: ['#DDF5EA', '#0B7650'], cup: ['#FDE7DA', '#B4400B'], bus: ['#E4E5FC', '#4B52E0'], pill: ['#EFE7FD', '#6D3FD1'], other: ['#E9ECF0', '#575E68'], shop: ['#E9ECF0', '#575E68'], transfer: ['#E9ECF0', '#575E68'] },
        chart: { products: '#0E8A5F', cafe: '#D9701F', transport: '#4B52E0', health: '#A98BEF', other: '#B5BCC6', barOk: '#4B52E0', barOver: '#D9701F', limitLine: '#575E68' }
      },
      dark: {
        bg: '#0F1114', card: '#1A1D21', card2: '#24282D', ink: '#F2F4F7', muted: '#A3AAB5', sub: '#C9CED6',
        line: '#2C3036', chipBorder: '#3A3F46',
        primary: '#5B62F0', onPrimary: '#FFFFFF', primaryText: '#A4A8FF', primarySoft: '#262A4D',
        hero: '#23272C', heroBorder: '#353A41', heroText: '#FFFFFF', heroMuted: '#B9BEC7', heroProgress: '#5EE0A8',
        positive: '#4ADE9A', positiveSoft: '#16332A', warn: '#FF9A62', warnSoft: '#3A2418', warnOnHero: '#FFB088',
        hint: '#C4A8FF', hintSoft: '#2E2547', segTrack: '#1A1D21', segOn: '#33383F',
        reserve: '#5F6772', left: '#3FAE84', shadow: 'rgba(0,0,0,0.55)', navBg: '#16191C',
        cat: { cart: ['#16332A', '#4ADE9A'], cup: ['#3A2418', '#FF9A62'], bus: ['#262A4D', '#A4A8FF'], pill: ['#2E2547', '#C4A8FF'], other: ['#2A2E34', '#A3AAB5'], shop: ['#2A2E34', '#A3AAB5'], transfer: ['#2A2E34', '#A3AAB5'] },
        chart: { products: '#34C38A', cafe: '#F08A3C', transport: '#7C82FF', health: '#B79CFF', other: '#6B7380', barOk: '#7C82FF', barOver: '#F08A3C', limitLine: '#A3AAB5' }
      }
    };
    const t = THEMES[this.props.theme] || THEMES.light;
    const month = this.state.month;
    const names = ['Продукты', 'Кафе', 'Транспорт', 'Здоровье', 'Другое'];
    const colors = [t.chart.products, t.chart.cafe, t.chart.transport, t.chart.health, t.chart.other];
    const amounts = month ? [2140, 980, 690, 386, 764] : [3410, 1520, 1080, 760, 1100];
    const total = amounts.reduce((a, b) => a + b, 0);
    const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    const C = 2 * Math.PI * 70;
    let cum = 0;
    const segs = amounts.map((a) => {
      const p = a / total;
      const len = Math.max(p * C - 3, 0);
      const seg = { dash: len.toFixed(2) + ' ' + (C - len).toFixed(2), offset: (-cum * C).toFixed(2) };
      cum += p;
      return seg;
    });
    const legend = names.map((name, i) => ({ name, color: colors[i], nameColor: t.sub, pctColor: t.ink, pct: Math.round(amounts[i] / total * 100) + '%' }));
    const values = [620, 940, 380, 1210, 1506, 330, 450];
    const labels = ['Ср 7', 'Чт 8', 'Пт 9', 'Сб 10', 'Вс 11', 'Пн 12', 'Вт 13'];
    const max = 1506;
    const bars = values.map((v, i) => ({
      h: Math.round(v / max * 120) + 'px',
      color: v > 781 ? t.chart.barOver : t.chart.barOk,
      label: labels[i],
      labelColor: i === 6 ? t.ink : t.muted,
      labelWeight: i === 6 ? '700' : '400',
      aria: labels[i] + ': ' + fmt(v) + ' ₽'
    }));
    return {
      t,
      c0: colors[0], c1: colors[1], c2: colors[2], c3: colors[3], c4: colors[4],
      s0: segs[0], s1: segs[1], s2: segs[2], s3: segs[3], s4: segs[4],
      legend, bars,
      total: fmt(total) + ' ₽',
      rangeShort: month ? '1–13 октября' : '25 сен – 13 окт',
      donutLabel: 'Расходы по категориям: ' + legend.map((l) => l.name + ' ' + l.pct).join(', '),
      periodPressed: month ? 'false' : 'true',
      monthPressed: month ? 'true' : 'false',
      periodBg: month ? 'transparent' : t.segOn,
      monthBg: month ? t.segOn : 'transparent',
      setPeriod: () => this.setState({ month: false }),
      setMonth: () => this.setState({ month: true })
    };
  }
}
</script>
</body>
</html>
