<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новая трата</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Onest', system-ui, sans-serif; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px 8px">
<a href="Main.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 22px; color: {{t.ink}}; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<div role="group" aria-label="Тип операции" style="display: flex; background: {{t.segTrack}}; border-radius: 22px; padding: 4px; gap: 4px">
<button type="button" onClick="{{setExpense}}" aria-pressed="{{expensePressed}}" style="height: 36px; padding: 0 18px; border: 0; border-radius: 18px; background: {{expenseBg}}; color: {{t.ink}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Трата</button>
<button type="button" onClick="{{setIncome}}" aria-pressed="{{incomePressed}}" style="height: 36px; padding: 0 18px; border: 0; border-radius: 18px; background: {{incomeBg}}; color: {{t.ink}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Доход</button>
</div>
<span style="width: 44px"></span>
</header>

<section aria-label="Сумма" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 16px 14px">
<output aria-live="polite" style="font-family: 'Unbounded', sans-serif; font-size: 48px; font-weight: 600; letter-spacing: -1px; color: {{amountColor}}">{{amountText}}</output>
<span style="font-size: 14px; font-weight: 500; color: {{hintColor}}; background: {{hintBg}}; border-radius: 10px; padding: 5px 10px">{{hint}}</span>
</section>

<section aria-label="Категория" style="padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: {{t.muted}}">Категория · сначала частые</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 44px; border-radius: 14px; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</section>

<div style="display: flex; gap: 8px; padding: 12px 16px 0">
<button type="button" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid {{t.chipBorder}}; border-radius: 14px; background: {{t.card}}; color: {{t.ink}}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Сегодня</button>
<button type="button" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid {{t.chipBorder}}; border-radius: 14px; background: {{t.card}}; color: {{t.ink}}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"></path></svg>Комментарий</button>
</div>

<div role="group" aria-label="Цифровая клавиатура" style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 0">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 54px; border: 0; border-radius: 16px; background: {{k.bg}}; color: {{k.fg}}; font-family: inherit; font-size: 24px; font-weight: 500; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{k.isBack}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"></path><path d="M12 9l6 6M18 9l-6 6"></path></svg></sc-if>
<sc-if value="{{k.isDigit}}" hint-placeholder-val="{{true}}">{{k.label}}</sc-if>
</button>
</sc-for>
</div>

<footer style="padding: 12px 16px 20px">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: {{t.primary}}; color: {{t.onPrimary}}; text-decoration: none; font-size: 17px; font-weight: 600">Сохранить</a>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: '180', cat: 'Кафе', income: false };
  }
  renderVals() {
    const THEMES = {
      light: {
        bg: '#EFF1F5', card: '#FFFFFF', card2: '#E4E7ED', ink: '#191C1F', muted: '#575E68', sub: '#3A4048',
        line: '#E2E5EA', chipBorder: '#CDD2DA',
        primary: '#4B52E0', onPrimary: '#FFFFFF', primaryText: '#4B52E0', primarySoft: '#E4E5FC',
        hero: '#191C1F', heroBorder: '#191C1F', heroText: '#FFFFFF', heroMuted: '#B9BEC7', heroProgress: '#5EE0A8',
        positive: '#0B7650', positiveSoft: '#DDF5EA', warn: '#B23A0A', warnSoft: '#FDE7DA', warnOnHero: '#FFB088',
        hint: '#6D3FD1', hintSoft: '#EFE7FD', segTrack: '#E4E7ED', segOn: '#FFFFFF',
        reserve: '#9AA1AC', left: '#9FE3C5', shadow: 'rgba(25,28,31,0.25)', navBg: '#FFFFFF',
        cat: { cart: ['#DDF5EA', '#0B7650'], cup: ['#FDE7DA', '#B4400B'], bus: ['#E4E5FC', '#4B52E0'], pill: ['#EFE7FD', '#6D3FD1'], other: ['#E9ECF0', '#575E68'], shop: ['#E9ECF0', '#575E68'], transfer: ['#E9ECF0', '#575E68'] },
        chart: { products: '#0E8A5F', cafe: '#D9701F', transport: '#4B52E0', health: '#A98BEF', other: '#B5BCC6', barOk: '#4B52E0', barOver: '#D9701F', limitLine: '#575E68' }
      },
      dark: {
        bg: '#0F1114', card: '#1A1D21', card2: '#24282D', ink: '#F2F4F7', muted: '#A3AAB5', sub: '#C9CED6',
        line: '#2C3036', chipBorder: '#3A3F46',
        primary: '#5B62F0', onPrimary: '#FFFFFF', primaryText: '#A4A8FF', primarySoft: '#262A4D',
        hero: '#23272C', heroBorder: '#353A41', heroText: '#FFFFFF', heroMuted: '#B9BEC7', heroProgress: '#5EE0A8',
        positive: '#4ADE9A', positiveSoft: '#16332A', warn: '#FF9A62', warnSoft: '#3A2418', warnOnHero: '#FFB088',
        hint: '#C4A8FF', hintSoft: '#2E2547', segTrack: '#1A1D21', segOn: '#33383F',
        reserve: '#5F6772', left: '#3FAE84', shadow: 'rgba(0,0,0,0.55)', navBg: '#16191C',
        cat: { cart: ['#16332A', '#4ADE9A'], cup: ['#3A2418', '#FF9A62'], bus: ['#262A4D', '#A4A8FF'], pill: ['#2E2547', '#C4A8FF'], other: ['#2A2E34', '#A3AAB5'], shop: ['#2A2E34', '#A3AAB5'], transfer: ['#2A2E34', '#A3AAB5'] },
        chart: { products: '#34C38A', cafe: '#F08A3C', transport: '#7C82FF', health: '#B79CFF', other: '#6B7380', barOk: '#7C82FF', barOver: '#F08A3C', limitLine: '#A3AAB5' }
      }
    };
    const t = THEMES[this.props.theme] || THEMES.light;
    const s = this.state;
    const press = (key) => () => {
      let a = s.amount;
      if (key === 'back') a = a.slice(0, -1);
      else if (key === ',') { if (!a.includes(',')) a = (a === '' ? '0' : a) + ','; }
      else {
        const parts = a.split(',');
        if (parts.length === 2 && parts[1].length >= 2) return;
        if (parts[0].length >= 7 && parts.length === 1) return;
        a = a === '0' ? key : a + key;
      }
      this.setState({ amount: a });
    };
    const keyList = ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', 'back'];
    const keys = keyList.map((k) => ({
      label: k,
      isBack: k === 'back',
      isDigit: k !== 'back',
      aria: k === 'back' ? 'Стереть' : (k === ',' ? 'Запятая' : k),
      bg: t.card,
      fg: t.ink,
      press: press(k)
    }));
    const whole = s.amount.split(',')[0] || '0';
    const pretty = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (s.amount.includes(',') ? ',' + s.amount.split(',')[1] : '');
    const value = parseInt(whole, 10) || 0;
    const left = 331 - value;
    let hint, hintColor, hintBg;
    if (s.income) {
      hint = 'Доход увеличит бюджет периода';
      hintColor = t.positive; hintBg = t.positiveSoft;
    } else if (left >= 0) {
      hint = 'Сегодня останется ' + String(left).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
      hintColor = t.positive; hintBg = t.positiveSoft;
    } else {
      hint = 'Перерасход ' + String(-left).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽ на сегодня';
      hintColor = t.warn; hintBg = t.warnSoft;
    }
    const catNames = s.income ? ['Стипендия', 'Зарплата', 'Перевод', 'Возврат', 'Подарок', 'Другое'] : ['Кафе', 'Продукты', 'Транспорт', 'Покупки', 'Здоровье', 'Другое'];
    const cats = catNames.map((label) => {
      const on = s.cat === label;
      return {
        label,
        pressed: on ? 'true' : 'false',
        bg: on ? t.primary : t.card,
        fg: on ? t.onPrimary : t.ink,
        border: on ? '1px solid ' + t.primary : '1px solid ' + t.chipBorder,
        pick: () => this.setState({ cat: label })
      };
    });
    return {
      t,
      keys,
      cats,
      amountText: (s.income ? '+' : '') + (s.amount === '' ? '0' : pretty) + ' ₽',
      amountColor: s.income ? t.positive : t.ink,
      hint, hintColor, hintBg,
      expensePressed: s.income ? 'false' : 'true',
      incomePressed: s.income ? 'true' : 'false',
      expenseBg: s.income ? 'transparent' : t.segOn,
      incomeBg: s.income ? t.segOn : 'transparent',
      setExpense: () => this.setState({ income: false, cat: 'Кафе' }),
      setIncome: () => this.setState({ income: true, cat: 'Стипендия' })
    };
  }
}
</script>
</body>
</html>
