<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сверка с банком</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Onest', system-ui, sans-serif; overflow: hidden">

<header style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px 8px">
<a href="Main.dc.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; color: {{t.ink}}; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 600">Сверка с банком</h1>
<span style="font-size: 13px; color: {{t.muted}}">Карта ··4417 · сегодня, 14:26</span>
</div>
</header>

<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 8px 16px 0">

<section aria-label="Сравнение остатков" style="background: {{t.card}}; border-radius: 22px; padding: 4px 18px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">В банке</span><span style="font-size: 13px; color: {{t.muted}}">из уведомления в 14:26</span></span>
<span style="font-size: 18px; font-weight: 600">12 300 ₽</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid {{t.line}}">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">В приложении</span><span style="font-size: 13px; color: {{t.muted}}">по вашим операциям</span></span>
<span style="font-size: 18px; font-weight: 600">12 750 ₽</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid {{t.line}}">
<span style="font-size: 15px; font-weight: 600">Разница</span>
<span style="font-size: 16px; font-weight: 700; color: {{t.warn}}; background: {{t.warnSoft}}; border-radius: 10px; padding: 4px 10px">−450 ₽</span>
</div>
</section>

<p style="margin: 0; padding: 0 4px; font-size: 14px; line-height: 1.45; color: {{t.sub}}">Похоже, какая-то трата не попала в приложение: оплата наличными, пропущенное уведомление или комиссия банка.</p>

<div role="group" aria-label="Что сделать с разницей" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; min-height: 64px; box-sizing: border-box; border-radius: 18px; border: 2px solid {{o.border}}; background: {{o.bg}}; color: {{o.ink}}; font-family: inherit; cursor: pointer">
<span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{o.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{o.dot}}"></span>
</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{o.title}}</span><span style="font-size: 13px; color: {{o.muted}}">{{o.desc}}</span></span>
</button>
</sc-for>
</div>

<a href="Main.dc.html" style="align-self: center; min-height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 15px; font-weight: 600; color: {{t.primaryText}}; text-decoration: none">Ввести остаток вручную</a>

</main>

<footer style="flex-shrink: 0; padding: 12px 16px 20px">
<a href="{{ctaHref}}" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: {{t.primary}}; color: {{t.onPrimary}}; text-decoration: none; font-size: 17px; font-weight: 600">{{ctaText}}</a>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { choice: 'fix' };
  }
  renderVals() {
    const THEMES = {
      light: {
        bg: '#EFF1F5', card: '#FFFFFF', card2: '#E4E7ED', ink: '#191C1F', muted: '#575E68', sub: '#3A4048',
        line: '#E2E5EA', chipBorder: '#CDD2DA',
        primary: '#4B52E0', onPrimary: '#FFFFFF', primaryText: '#4B52E0', primarySoft: '#E4E5FC',
        hero: '#191C1F', heroBorder: '#191C1F', heroText: '#FFFFFF', heroMuted: '#B9BEC7', heroProgress: '#5EE0A8',
        positive: '#0B7650', positiveSoft: '#DDF5EA', warn: '#B23A0A', warnSoft: '#FDE7DA', warnOnHero: '#FFB088',
        hint: '#6D3FD1', hintSoft: '#EFE7FD', segTrack: '#E4E7ED', segOn: '#FFFFFF',
        reserve: '#9AA1AC', left: '#9FE3C5', shadow: 'rgba(25,28,31,0.25)', navBg: '#FFFFFF',
        cat: { cart: ['#DDF5EA', '#0B7650'], cup: ['#FDE7DA', '#B4400B'], bus: ['#E4E5FC', '#4B52E0'], pill: ['#EFE7FD', '#6D3FD1'], other: ['#E9ECF0', '#575E68'], shop: ['#E9ECF0', '#575E68'], transfer: ['#E9ECF0', '#575E68'] },
        chart: { products: '#0E8A5F', cafe: '#D9701F', transport: '#4B52E0', health: '#A98BEF', other: '#B5BCC6', barOk: '#4B52E0', barOver: '#D9701F', limitLine: '#575E68' }
      },
      dark: {
        bg: '#0F1114', card: '#1A1D21', card2: '#24282D', ink: '#F2F4F7', muted: '#A3AAB5', sub: '#C9CED6',
        line: '#2C3036', chipBorder: '#3A3F46',
        primary: '#5B62F0', onPrimary: '#FFFFFF', primaryText: '#A4A8FF', primarySoft: '#262A4D',
        hero: '#23272C', heroBorder: '#353A41', heroText: '#FFFFFF', heroMuted: '#B9BEC7', heroProgress: '#5EE0A8',
        positive: '#4ADE9A', positiveSoft: '#16332A', warn: '#FF9A62', warnSoft: '#3A2418', warnOnHero: '#FFB088',
        hint: '#C4A8FF', hintSoft: '#2E2547', segTrack: '#1A1D21', segOn: '#33383F',
        reserve: '#5F6772', left: '#3FAE84', shadow: 'rgba(0,0,0,0.55)', navBg: '#16191C',
        cat: { cart: ['#16332A', '#4ADE9A'], cup: ['#3A2418', '#FF9A62'], bus: ['#262A4D', '#A4A8FF'], pill: ['#2E2547', '#C4A8FF'], other: ['#2A2E34', '#A3AAB5'], shop: ['#2A2E34', '#A3AAB5'], transfer: ['#2A2E34', '#A3AAB5'] },
        chart: { products: '#34C38A', cafe: '#F08A3C', transport: '#7C82FF', health: '#B79CFF', other: '#6B7380', barOk: '#7C82FF', barOver: '#F08A3C', limitLine: '#A3AAB5' }
      }
    };
    const t = THEMES[this.props.theme] || THEMES.light;
    const list = [
      { id: 'fix', title: 'Записать трату без категории', desc: '−450 ₽ сегодня, категорию можно выбрать позже', cta: 'Записать корректировку', href: 'Main.dc.html' },
      { id: 'find', title: 'Найти пропущенную операцию', desc: 'Операции после прошлой сверки, 10 октября', cta: 'Открыть операции', href: 'Operations.dc.html' },
      { id: 'skip', title: 'Пропустить', desc: 'Расчёт не изменится, точкой отсчёта станет 12 300 ₽', cta: 'Пропустить', href: 'Main.dc.html' }
    ];
    const choice = this.state.choice;
    const options = list.map((o) => {
      const on = o.id === choice;
      return {
        ...o,
        pressed: on ? 'true' : 'false',
        border: on ? t.primary : t.line,
        bg: t.card,
        ink: t.ink,
        muted: t.muted,
        ring: on ? t.primary : t.chipBorder,
        dot: on ? t.primary : 'transparent',
        pick: () => this.setState({ choice: o.id })
      };
    });
    const current = list.find((o) => o.id === choice) || list[0];
    return { t, options, ctaText: current.cta, ctaHref: current.href };
  }
}
</script>
</body>
</html>
