<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Онбординг: автоимпорт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Onest', system-ui, sans-serif; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0 8px; flex-shrink: 0">
<a href="Main.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.ink}}; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<a href="Main.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 8px; font-size: 15px; font-weight: 600; color: {{t.primaryText}}; text-decoration: none">Пропустить</a>
</header>

<div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
<div aria-hidden="true" style="display: flex; gap: 6px">
<div style="flex: 1; height: 4px; border-radius: 2px; background: {{t.primary}}"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: {{t.primary}}"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: {{t.primary}}"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: {{t.card2}}"></div>
</div>
<span style="font-size: 13px; line-height: 18px; color: {{t.muted}}">Шаг 3 из 4</span>
</div>

<div aria-hidden="true" style="align-self: center; position: relative; width: 120px; height: 120px; margin-top: 20px; flex-shrink: 0">
<div style="width: 120px; height: 120px; border-radius: 60px; background: {{t.card}}; display: flex; align-items: center; justify-content: center">
<span style="width: 64px; height: 64px; border-radius: 20px; background: {{t.primarySoft}}; color: {{t.primaryText}}; display: flex; align-items: center; justify-content: center">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
</span>
</div>
<span style="position: absolute; right: 0; bottom: 0; width: 36px; height: 36px; box-sizing: border-box; border-radius: 18px; border: 3px solid {{t.bg}}; background: {{t.positiveSoft}}; color: {{t.positive}}; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
</div>

<h1 style="margin: 20px 0 0; padding: 0 24px; text-align: center; font-family: 'Unbounded', sans-serif; font-size: 24px; font-weight: 600; line-height: 1.2; color: {{t.ink}}">Траты будут добавляться сами</h1>

<p style="margin: 10px 0 0; padding: 0 28px; text-align: center; font-size: 15px; line-height: 1.45; color: {{t.sub}}">BudgetPlanner читает уведомления вашего банка и сам записывает покупки. Вводить суммы вручную почти не придётся.</p>

<ul aria-label="Что происходит с уведомлениями" style="margin: 18px 16px 0; padding: 4px 16px; list-style: none; background: {{t.card}}; border-radius: 22px; flex-shrink: 0">
<sc-for list="{{guarantees}}" as="item" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 0; box-sizing: border-box; border-bottom: {{item.border}}">
<span style="width: 32px; height: 32px; border-radius: 10px; background: {{item.tileBg}}; color: {{item.tileFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<span style="flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; color: {{item.ink}}">{{item.text}}</span>
</li>
</sc-for>
</ul>

<p style="margin: 14px 0 0; padding: 0 24px; display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.4; color: {{t.muted}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<span>Доступ можно отключить в любой момент в настройках телефона.</span>
</p>

<div style="margin-top: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: {{t.primary}}; color: {{t.onPrimary}}; font-size: 17px; font-weight: 600; text-decoration: none">Открыть настройки доступа</a>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; box-sizing: border-box; border-radius: 18px; background: transparent; border: 1px solid {{t.chipBorder}}; color: {{t.ink}}; font-size: 16px; font-weight: 600; text-decoration: none">Вводить вручную</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const THEMES = {
      light: {
        bg: '#EFF1F5', card: '#FFFFFF', card2: '#E4E7ED', ink: '#191C1F', muted: '#575E68', sub: '#3A4048',
        line: '#E2E5EA', chipBorder: '#CDD2DA',
        primary: '#4B52E0', onPrimary: '#FFFFFF', primaryText: '#4B52E0', primarySoft: '#E4E5FC',
        hero: '#191C1F', heroBorder: '#191C1F', heroText: '#FFFFFF', heroMuted: '#B9BEC7', heroProgress: '#5EE0A8',
        positive: '#0B7650', positiveSoft: '#DDF5EA', warn: '#B23A0A', warnSoft: '#FDE7DA', warnOnHero: '#FFB088',
        hint: '#6D3FD1', hintSoft: '#EFE7FD', segTrack: '#E4E7ED', segOn: '#FFFFFF',
        reserve: '#9AA1AC', left: '#9FE3C5', shadow: 'rgba(25,28,31,0.25)', navBg: '#FFFFFF',
        cat: { cart: ['#DDF5EA', '#0B7650'], cup: ['#FDE7DA', '#B4400B'], bus: ['#E4E5FC', '#4B52E0'], pill: ['#EFE7FD', '#6D3FD1'], other: ['#E9ECF0', '#575E68'], shop: ['#E9ECF0', '#575E68'], transfer: ['#E9ECF0', '#575E68'] },
        chart: { products: '#0E8A5F', cafe: '#D9701F', transport: '#4B52E0', health: '#A98BEF', other: '#B5BCC6', barOk: '#4B52E0', barOver: '#D9701F', limitLine: '#575E68' }
      },
      dark: {
        bg: '#0F1114', card: '#1A1D21', card2: '#24282D', ink: '#F2F4F7', muted: '#A3AAB5', sub: '#C9CED6',
        line: '#2C3036', chipBorder: '#3A3F46',
        primary: '#5B62F0', onPrimary: '#FFFFFF', primaryText: '#A4A8FF', primarySoft: '#262A4D',
        hero: '#23272C', heroBorder: '#353A41', heroText: '#FFFFFF', heroMuted: '#B9BEC7', heroProgress: '#5EE0A8',
        positive: '#4ADE9A', positiveSoft: '#16332A', warn: '#FF9A62', warnSoft: '#3A2418', warnOnHero: '#FFB088',
        hint: '#C4A8FF', hintSoft: '#2E2547', segTrack: '#1A1D21', segOn: '#33383F',
        reserve: '#5F6772', left: '#3FAE84', shadow: 'rgba(0,0,0,0.55)', navBg: '#16191C',
        cat: { cart: ['#16332A', '#4ADE9A'], cup: ['#3A2418', '#FF9A62'], bus: ['#262A4D', '#A4A8FF'], pill: ['#2E2547', '#C4A8FF'], other: ['#2A2E34', '#A3AAB5'], shop: ['#2A2E34', '#A3AAB5'], transfer: ['#2A2E34', '#A3AAB5'] },
        chart: { products: '#34C38A', cafe: '#F08A3C', transport: '#7C82FF', health: '#B79CFF', other: '#6B7380', barOk: '#7C82FF', barOver: '#F08A3C', limitLine: '#A3AAB5' }
      }
    };
    const t = THEMES[this.props.theme] || THEMES.light;
    const texts = [
      'Читаем только уведомления банковских приложений',
      'Сохраняем сумму, магазин и дату, а не текст уведомления',
      'Не видим пароли, коды подтверждения и данные карты',
      'Ничего не отправляем в интернет'
    ];
    const guarantees = texts.map((text, i) => ({
      text,
      tileBg: t.positiveSoft,
      tileFg: t.positive,
      ink: t.ink,
      border: i < texts.length - 1 ? '1px solid ' + t.line : '0'
    }));
    return { t, guarantees };
  }
}
</script>
</body>
</html>
